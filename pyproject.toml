[project]
name = "apex-pace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaron", email = "aaronchinosrs@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.139.2",
    "fastf1>=3.8.3",
    "polars>=1.43.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.51.0",
    "wandb>=0.28.1",
    "xgboost>=3.3.0",
]

[project.scripts]
apex-pace = "apex_pace:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
